apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-ksm-reader
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources:
      - services/proxy
    resourceNames:
      - "http:kube-state-metrics:8080"
    verbs:
      - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-ksm-reader-binding
  namespace: monitoring
subjects:
  - kind: ServiceAccount
    name: prometheus-external
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-ksm-reader
